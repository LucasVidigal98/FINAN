services:
  postgres:
    image: postgres:16-alpine
    container_name: finan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finan}
      POSTGRES_USER: ${POSTGRES_USER:-finan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finan}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finan} -d ${POSTGRES_DB:-finan}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

