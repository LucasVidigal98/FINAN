services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: finan-backend
    working_dir: /workspace
    command: sh ./docker/dev-entrypoint.sh
    environment:
      SPRING_DATASOURCE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finan}}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finan}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env ou no ambiente}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/workspace
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: finan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finan}
      POSTGRES_USER: ${POSTGRES_USER:-finan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env ou no ambiente}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finan} -d ${POSTGRES_DB:-finan}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
