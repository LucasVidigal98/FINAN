<form [formGroup]="form" (ngSubmit)="submit()" aria-labelledby="transaction-form-title">
  <div class="form-heading">
    <div>
      <p class="eyebrow">Nova movimentação</p>
      <h2 id="transaction-form-title">Adicionar transação</h2>
    </div>
    <p>Registre receitas, despesas e investimentos.</p>
  </div>

  <label>
    Descrição
    <input type="text" formControlName="description" maxlength="150" />
  </label>

  <label>
    Valor
    <input type="number" formControlName="amount" min="0.01" step="0.01" />
  </label>

  <label>
    Data
    <input type="date" formControlName="occurredOn" />
  </label>

  <label>
    Tipo
    <select formControlName="type">
      <option value="INCOME">Receita</option>
      <option value="EXPENSE">Despesa</option>
      <option value="INVESTMENT">Investimento</option>
    </select>
  </label>

  <label>
    Categoria
    <select formControlName="categoryId" [attr.disabled]="categoriesLoading() ? true : null">
      <option [ngValue]="null">
        {{ categoriesLoading() ? 'Carregando categorias...' : 'Sem categoria' }}
      </option>
      @for (category of filteredCategories(); track category.id) {
        <option [value]="category.id">{{ category.name }}</option>
      }
    </select>
  </label>

  <button type="submit" [disabled]="form.invalid || isSubmitting">
    {{ isSubmitting ? 'Salvando…' : 'Adicionar transação' }}
  </button>

  @if (errorMessage) {
    <p role="alert">{{ errorMessage }}</p>
  }

  @if (categoriesLoadError()) {
    <p class="category-load-error" role="status">
      As categorias não puderam ser carregadas. Você ainda pode salvar sem categoria.
    </p>
  }
</form>
